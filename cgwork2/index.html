<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三维层级场景 · 太阳系</title>
<style>
:root {
  --ground: #f5f3ee;
  --ink:    #221f1b;
  --muted:  #8b857a;
  --rule:   #ded9cf;
  --accent: #a3371c;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--ground);
  color: var(--ink);
}

/* 控制栏用发丝线分区，不用卡片 */
#panel {
  width: 290px;
  flex: none;
  padding: 28px 24px;
  border-right: 1px solid var(--rule);
  overflow-y: auto;
}
h1 { font-size: 19px; font-weight: 600; margin: 0 0 24px; letter-spacing: .02em; }
h1::before { content: ""; display: block; width: 28px; height: 2px; background: var(--accent); margin-bottom: 10px; }

/* 分组：组间发丝线，组内不再逐条分割 */
.group { border-top: 1px solid var(--rule); padding: 22px 0 14px; }
.group h2 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .15em;
  color: var(--ink);
  margin: 0 0 12px;
}
.field { padding: 10px 0; }
.field.row { display: flex; gap: 8px; }
.field.row button { flex: 1; font-size: 12px; letter-spacing: .06em; padding: 7px 0; }

/* 轻量开关：小方框，选中填墨 */
.check {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  font-size: 12px;
  letter-spacing: .08em;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}
.check i { width: 11px; height: 11px; border: 1px solid var(--ink); }
.check.on { color: var(--ink); }
.check.on i { background: var(--ink); }
.field label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .08em;
  margin-bottom: 8px;
}
.val { color: var(--ink); font-variant-numeric: tabular-nums; }

/* 滑条 */
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 14px;
  background: transparent;
  margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px;
  height: 11px;
  margin-top: -5px;
  background: var(--ground);
  border: 1px solid var(--ink);
  border-radius: 0;
}
input[type=range]::-moz-range-track { height: 1px; background: var(--ink); }
input[type=range]::-moz-range-thumb {
  width: 9px;
  height: 9px;
  background: var(--ground);
  border: 1px solid var(--ink);
  border-radius: 0;
}

/* 按钮 */
button.wide {
  width: 100%;
  padding: 8px 0;
  background: none;
  border: 1px solid var(--ink);
  color: var(--ink);
  font: inherit;
  letter-spacing: .15em;
  cursor: pointer;
}
button.wide:hover { border-color: var(--accent); color: var(--accent); }
button.wide.on,
button.wide.on:hover { background: var(--ink); color: var(--ground); border-color: var(--ink); }

/* 分段选择：按钮连成一条 */
.seg { display: flex; }
.seg button {
  flex: 1;
  padding: 7px 0;
  margin-left: -1px;
  background: none;
  border: 1px solid var(--ink);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  letter-spacing: .08em;
  cursor: pointer;
}
.seg button:first-child { margin-left: 0; }
.seg button:hover { border-color: var(--accent); color: var(--accent); position: relative; }
.seg button.on,
.seg button.on:hover { background: var(--ink); color: var(--ground); border-color: var(--ink); position: relative; }

/* 操作图例 */
.legend {
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
  font-size: 12px;
  color: var(--muted);
}
.legend b { color: var(--ink); font-weight: 600; margin-right: 6px; }

/* 画布 */
main { flex: 1; position: relative; min-width: 0; background: #05060b; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<aside id="panel"></aside>
<main><canvas id="gl-canvas"></canvas></main>

<script id="sphere-vertex" type="x-shader/x-vertex">#version 300 es
in vec3 aPosition;
in vec3 aNormal;
in vec2 aTexCoord;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;
out vec3 vNormal;
out vec3 vWorld;
out vec2 vTexCoord;
void main() {
  vec4 world = uModel * vec4(aPosition, 1.0);
  vWorld = world.xyz;
  vNormal = mat3(uModel) * aNormal; // 均匀缩放，法线直接用 mat3
  vTexCoord = aTexCoord;
  gl_Position = uProj * uView * world;
}
</script>

<script id="sphere-fragment" type="x-shader/x-fragment">#version 300 es
precision mediump float;
in vec3 vNormal;
in vec3 vWorld;
in vec2 vTexCoord;
uniform sampler2D uTex;
uniform bool uEmissive;
uniform vec3 uSunPos;
out vec4 fColor;
void main() {
  vec4 tex = texture(uTex, vTexCoord);
  if (uEmissive) {
    fColor = tex; // 自发光（太阳、土星环）
    return;
  }
  // 简单漫反射
  float diff = max(dot(normalize(vNormal), normalize(uSunPos - vWorld)), 0.0);
  fColor = vec4(tex.rgb * (0.06 + 0.94 * diff), tex.a);
}
</script>

<script id="line-vertex" type="x-shader/x-vertex">#version 300 es
in vec3 aPosition;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;
uniform float uPointSize;
void main() {
  gl_Position = uProj * uView * uModel * vec4(aPosition, 1.0);
  gl_PointSize = uPointSize; // 小行星带用，轨道线忽略
}
</script>

<script id="line-fragment" type="x-shader/x-fragment">#version 300 es
precision mediump float;
uniform vec3 uColor;
out vec4 fColor;
void main() { fColor = vec4(uColor, 1.0); }
</script>

<script src="../Common/initShaders.js"></script>
<script src="../Common/MV.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
